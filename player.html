<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap');

  #wtp-widget{
    --wtp-bg: #0A0C12;
    --wtp-bg-elevated: #12151E;
    --wtp-card: #171A24;
    --wtp-accent: #E8B84B;
    --wtp-accent-dim: #a3862f;
    --wtp-text: #F2F1EC;
    --wtp-text-dim: #8B8F9C;
    --wtp-line: rgba(255,255,255,0.07);
    --wtp-shadow-md: 0 8px 24px rgba(0,0,0,0.32);
    --wtp-shadow-glow: 0 0 24px rgba(232,184,75,0.15);
    --wtp-radius: 16px;

    width:100%; max-width: 780px; margin: 0 auto;
    font-family: 'Manrope', sans-serif;
    background: var(--wtp-card);
    border: 1px solid var(--wtp-line);
    border-radius: var(--wtp-radius);
    overflow: hidden;
    box-shadow: var(--wtp-shadow-md);
    box-sizing: border-box;
  }
  #wtp-widget *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  #wtp-widget .wtp-video-stage{
    position:relative; width:100%; aspect-ratio: 16/9;
    background: #000;
  }
  #wtp-widget video{ width:100%; height:100%; display:block; background:#000; }

  #wtp-widget .wtp-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding: 20px; text-align:center;
    background: radial-gradient(circle at 50% 40%, rgba(232,184,75,0.08), transparent 60%), var(--wtp-bg);
    transition: opacity .3s ease;
  }
  #wtp-widget .wtp-overlay.wtp-hidden{ opacity:0; pointer-events:none; }
  #wtp-widget .wtp-ring{
    width:44px; height:44px; border-radius:50%;
    border: 3px solid rgba(232,184,75,0.18);
    border-top-color: var(--wtp-accent);
    animation: wtp-spin 0.9s linear infinite;
  }
  #wtp-widget .wtp-ring.wtp-error{
    border-color: #ff4d4d; border-top-color: #ff4d4d; animation: none;
  }
  #wtp-widget .wtp-overlay-text{
    font-size:13px; font-weight:700; color: var(--wtp-text-dim); line-height: 1.4;
  }
  @keyframes wtp-spin{ to{ transform: rotate(360deg); } }

  #wtp-widget .wtp-controls-bar{ padding: 14px 20px 18px; }

  #wtp-widget .wtp-scrub-row{
    display:flex; align-items:center; gap:12px; margin-bottom:10px;
  }
  #wtp-widget .wtp-scrub{
    -webkit-appearance:none; appearance:none;
    flex:1; height:5px; border-radius:999px;
    background: linear-gradient(to right, var(--wtp-accent) 0%, var(--wtp-accent) 0%, var(--wtp-line) 0%);
    cursor:pointer; outline:none; margin:0;
  }
  #wtp-widget .wtp-scrub::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background: var(--wtp-accent);
    box-shadow: 0 0 0 4px rgba(232,184,75,0.18);
    cursor:pointer;
    transition: transform .15s ease;
  }
  #wtp-widget .wtp-scrub::-webkit-slider-thumb:active{ transform: scale(1.2); }
  #wtp-widget .wtp-scrub::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:none;
    background: var(--wtp-accent); cursor:pointer;
  }
  #wtp-widget .wtp-time{
    font-size:11.5px; font-weight:700; color: var(--wtp-text-dim);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
  }

  #wtp-widget .wtp-controls-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  #wtp-widget .wtp-left-controls{ display:flex; align-items:center; gap:10px; }

  #wtp-widget .wtp-icon-btn{
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: var(--wtp-bg-elevated); border:1px solid var(--wtp-line);
    color:var(--wtp-text); cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  #wtp-widget .wtp-icon-btn:hover{ background:#1c202c; }
  #wtp-widget .wtp-icon-btn:active{ transform: scale(0.9); }
  #wtp-widget .wtp-icon-btn.wtp-primary{
    background: var(--wtp-accent); border-color: var(--wtp-accent); color:#1a1400;
    box-shadow: var(--wtp-shadow-glow);
  }
  #wtp-widget .wtp-icon-btn.wtp-primary:hover{ background: var(--wtp-accent); filter:brightness(1.05); }
  #wtp-widget .wtp-icon-btn svg{ width:18px; height:18px; }

  #wtp-widget .wtp-peer-info{
    font-size:11px; font-weight:700; color: var(--wtp-text-dim);
    display:flex; align-items:center; gap:6px;
  }
  #wtp-widget .wtp-peer-dot{
    width:6px; height:6px; border-radius:50%; background: var(--wtp-accent);
  }

  #wtp-widget .wtp-dl-bar-wrap{
    width:100%; height:3px; border-radius:999px;
    background: var(--wtp-line); margin-top:12px; overflow:hidden;
  }
  #wtp-widget .wtp-dl-bar-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--wtp-accent-dim), var(--wtp-accent));
    transition: width .25s ease;
  }

  @media (max-width:480px){
    #wtp-widget{ border-radius:0; max-width:100%; }
  }
</style>
</head>
<body style="margin:0; background:#0A0C12; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">

<div id="wtp-widget">

  <div class="wtp-video-stage">
    <video id="wtpVideo" preload="auto" crossorigin="anonymous"></video>
    <div class="wtp-overlay" id="wtpOverlay">
      <div class="wtp-ring" id="wtpRing"></div>
      <div class="wtp-overlay-text" id="wtpOverlayText">Başlatılıyor...</div>
    </div>
  </div>

  <div class="wtp-controls-bar">
    <div class="wtp-scrub-row">
      <input type="range" class="wtp-scrub" id="wtpScrubBar" min="0" max="100" value="0" step="0.1">
      <span class="wtp-time" id="wtpTimeLabel">00:00 / 00:00</span>
    </div>

    <div class="wtp-controls-row">
      <div class="wtp-left-controls">
        <button class="wtp-icon-btn wtp-primary" id="wtpPlayPauseBtn" title="Oynat/Duraklat">
          <svg id="wtpPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="wtpPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="wtp-peer-info"><span class="wtp-peer-dot"></span><span id="wtpPeerCount">0 kaynak</span></div>
      </div>
    </div>

    <div class="wtp-dl-bar-wrap"><div class="wtp-dl-bar-fill" id="wtpBufferBarFill"></div></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@2.1.36/webtorrent.min.js"></script>
<script>
(function(){
  const EXTRA_TRACKERS = [
    "wss://tracker.openwebtorrent.com",
    "wss://tracker.btorrent.xyz",
    "wss://tracker.files.fm:7073/announce",
    "udp://tracker.opentrackr.org:1337/announce",
    "udp://open.stealth.si:80/announce"
  ];

  const LOOKAHEAD_SECONDS = 90;

  const video = document.getElementById('wtpVideo');
  const playPauseBtn = document.getElementById('wtpPlayPauseBtn');
  const playIcon = document.getElementById('wtpPlayIcon');
  const pauseIcon = document.getElementById('wtpPauseIcon');
  const scrubBar = document.getElementById('wtpScrubBar');
  const timeLabel = document.getElementById('wtpTimeLabel');
  const bufferBarFill = document.getElementById('wtpBufferBarFill');
  const overlay = document.getElementById('wtpOverlay');
  const overlayText = document.getElementById('wtpOverlayText');
  const ring = document.getElementById('wtpRing');
  const peerCount = document.getElementById('wtpPeerCount');

  let activeTorrent = null;
  let activeFile = null;
  let client = null;

  function formatTime(sec) {
    if (!isFinite(sec)) return "00:00";
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function setStatus(msg, isError = false) {
    overlayText.textContent = msg;
    if (isError) {
      ring.classList.add('wtp-error');
    } else {
      ring.classList.remove('wtp-error');
    }
  }

  function hideOverlay() {
    overlay.classList.add('wtp-hidden');
  }

  // --- ARAMA VE AĞ MOTORU ---

  async function fetchNyaa(query) {
    const nyaaUrl = `https://nyaa.si/?page=rss&q=${encodeURIComponent(query)}&c=1_2&f=0`;
    const proxies = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(nyaaUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(nyaaUrl)}`
    ];

    for (const proxy of proxies) {
      try {
        const res = await fetch(proxy);
        if (!res.ok) continue;
        const xmlText = await res.text();
        const xml = new DOMParser().parseFromString(xmlText, "text/xml");
        const items = xml.querySelectorAll("item");
        if (items && items.length > 0) {
          const torrentLink = items[0].querySelector("link")?.textContent;
          if (torrentLink) return torrentLink;
        }
      } catch (e) {
        console.warn("Proxy hatası:", e);
      }
    }
    throw new Error("Nyaa üzerinde sonuç bulunamadı.");
  }

  async function fetchAnimeTosho(query) {
    const apiUrl = `https://animetosho.org/api/v1/show?q=${encodeURIComponent(query)}`;
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("AnimeTosho API'sine ulaşılamadı.");
    const data = await res.json();
    if (!data || data.length === 0) throw new Error("AnimeTosho üzerinde sonuç bulunamadı.");

    const link = data[0].magnet_uri || data[0].torrent_url;
    if (!link) throw new Error("Görsel kaynak adresi okunamadı.");
    return link;
  }

  async function resolveAndPlay() {
    const urlParams = new URLSearchParams(window.location.search);
    const directSrc = urlParams.get('src');
    const searchQuery = urlParams.get('q');

    if (directSrc) {
      setStatus("Doğrudan bağlantı yükleniyor...");
      startWebTorrent(directSrc);
      return;
    }

    if (!searchQuery) {
      setStatus("Hata: Herhangi bir arama terimi (?q=) veya link (?src=) verilmedi.", true);
      return;
    }

    // 1. AŞAMA: Nyaa.si Arama
    setStatus(`Nyaa.si üzerinde aranıyor: "${searchQuery}"`);
    try {
      const torrentUrl = await fetchNyaa(searchQuery);
      setStatus("Nyaa'dan kaynak bulundu! P2P ağına bağlanılıyor...");
      startWebTorrent(torrentUrl);
      return;
    } catch (err) {
      console.log("Nyaa başarısız, AnimeTosho yedek motoru devreye giriyor...", err);
    }

    // 2. AŞAMA: AnimeTosho Arama (Yedek)
    setStatus(`Nyaa bulunamadı. Yedek motor (AnimeTosho) aranıyor...`);
    try {
      const backupUrl = await fetchAnimeTosho(searchQuery);
      setStatus("AnimeTosho'dan kaynak bulundu! P2P ağına bağlanılıyor...");
      startWebTorrent(backupUrl);
    } catch (err2) {
      setStatus(`Hata: Ne Nyaa ne de AnimeTosho üzerinde yayın bulunamadı.`, true);
    }
  }

  function startWebTorrent(torrentSource) {
    client = new WebTorrent();

    client.on('error', (err) => {
      setStatus("P2P İstemci Hatası: " + err.message, true);
    });

    client.add(torrentSource, { announce: EXTRA_TRACKERS }, (torrent) => {
      activeTorrent = torrent;
      setStatus("Video dosyası ayıklanıyor...");

      const videoExtensions = /\.(mp4|mkv|webm)$/i;
      const file = torrent.files
        .filter(f => videoExtensions.test(f.name))
        .sort((a, b) => b.length - a.length)[0];

      if (!file) {
        setStatus("Hata: Torrent içerisinde oynatılabilir video dosyası bulunamadı.", true);
        return;
      }

      activeFile = file;
      setStatus("Akış hazırlanıyor, ilk veriler indiriliyor...");

      focusDownloadWindow(0);

      file.renderTo(video, { autoplay: false, controls: false }, (err) => {
        if (err) setStatus("Oynatma hatası: " + err.message, true);
      });

      video.addEventListener('canplay', () => {
        if (video.paused && video.currentTime === 0) {
          hideOverlay();
          video.play().catch(() => {});
        }
      });

      torrent.on('download', () => {
        const pct = (torrent.progress * 100).toFixed(1);
        bufferBarFill.style.width = pct + "%";
        peerCount.textContent = torrent.numPeers + " kaynak";
      });

      torrent.on('wire', () => {
        peerCount.textContent = torrent.numPeers + " kaynak";
      });
    });
  }

  function focusDownloadWindow(currentTimeSec) {
    if (!activeTorrent || !activeFile || !video.duration) return;

    const fileOffsetPieces = Math.floor(activeFile.offset / activeTorrent.pieceLength);
    const filePieceCount = Math.ceil(activeFile.length / activeTorrent.pieceLength);

    const secondsPerPiece = video.duration / filePieceCount;
    const currentPiece = fileOffsetPieces + Math.floor(currentTimeSec / secondsPerPiece);
    const lookaheadPieces = Math.max(2, Math.ceil(LOOKAHEAD_SECONDS / secondsPerPiece));

    const windowStart = Math.max(fileOffsetPieces, currentPiece);
    const windowEnd = Math.min(fileOffsetPieces + filePieceCount - 1, currentPiece + lookaheadPieces);

    activeTorrent.deselect(fileOffsetPieces, fileOffsetPieces + filePieceCount - 1, false);
    activeTorrent.select(windowStart, windowEnd, true);

    const criticalEnd = Math.min(windowEnd, windowStart + 1);
    activeTorrent.critical(windowStart, criticalEnd);
  }

  // --- KONTROL ETKİLEŞİMLERİ ---

  playPauseBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); hideOverlay(); }
    else { video.pause(); }
  });

  video.addEventListener('play', () => {
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
  });
  video.addEventListener('pause', () => {
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  });

  video.addEventListener('timeupdate', () => {
    if (!isFinite(video.duration)) return;
    const pct = (video.currentTime / video.duration) * 100;
    scrubBar.value = pct;
    scrubBar.style.background = `linear-gradient(to right, var(--wtp-accent) ${pct}%, var(--wtp-line) ${pct}%)`;
    timeLabel.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  video.addEventListener('loadedmetadata', () => {
    timeLabel.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  scrubBar.addEventListener('change', () => {
    if (!isFinite(video.duration)) return;
    const newTime = (scrubBar.value / 100) * video.duration;
    video.currentTime = newTime;
    focusDownloadWindow(newTime);
  });

  scrubBar.addEventListener('input', () => {
    if (!isFinite(video.duration)) return;
    video.currentTime = (scrubBar.value / 100) * video.duration;
    const pct = scrubBar.value;
    scrubBar.style.background = `linear-gradient(to right, var(--wtp-accent) ${pct}%, var(--wtp-line) ${pct}%)`;
  });

  video.addEventListener('seeked', () => {
    focusDownloadWindow(video.currentTime);
  });

  // Sistemi Başlat
  resolveAndPlay();
})();
</script>

</body>
</html>
